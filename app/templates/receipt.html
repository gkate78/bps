<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Receipt</title>
    <style>
        @page {
            size: 58mm auto;
            /* top right bottom left: the printer adds its own right-hand gap, so the right margin is smaller. */
            margin: 0.5mm 1.5mm 2mm 3mm;
        }
        body {
            /* Bold sans-serif prints darker and reads more easily than Courier on thermal paper. */
            font-family: Arial, Helvetica, "Liberation Sans", sans-serif;
            margin: 0;
            color: #000;
            width: 58mm;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.15;
        }
        .preview-actions {
            width: 58mm;
            margin: 0 auto;
            padding: 6px 4px 2px;
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .toolbar-btn {
            border: 1px solid #c8d3ee;
            background: #fff;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        .toolbar-btn.primary {
            border-color: #0e4dff;
            background: #0e4dff;
            color: #fff;
        }
        .receipt {
            width: 100%;
            margin: 0 auto;
            padding: 1mm 1mm 0;
        }
        .shop {
            text-align: center;
            margin-bottom: 1.5mm;
        }
        .shop h1 {
            margin: 0;
            font-size: 14px;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }
        .shop p {
            margin: 0.5mm 0 0;
            font-size: 12px;
            text-transform: uppercase;
            line-height: 1.25;
        }
        .line {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            column-gap: 2mm;
            padding: 0.4mm 0;
            font-size: 12px;
            text-transform: uppercase;
        }
        .info {
            padding: 0.3mm 0;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }
        .info + .line {
            margin-top: 1mm;
        }
        /* Amounts stay on one line, flush right, with equal-width digits so decimals line up. */
        .line span:last-child {
            margin-left: auto;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .total {
            font-size: 16px;
            border-top: 1px dashed #000;
            margin-top: 0.8mm;
            padding-top: 1mm;
        }
        .meta {
            margin-top: 2mm;
            font-size: 12px;
            text-align: center;
            text-transform: uppercase;
        }
        .sign {
            margin-top: 10mm; /* room for one extra line to sign */
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
        }
        /* Each copy, and each bill paid together, is its own receipt (the printer cuts between them). */
        .receipt + .receipt {
            break-before: page;
            page-break-before: always;
        }
        .sign-line {
            border-top: 1px solid #111;
            margin: 0 auto 1.2mm;
            width: 70%;
        }
        @media print {
            /* Fit the printable area inside the @page margins so the right edge isn't cut off,
               but never wider than the 58mm roll if the printer reports larger paper. */
            body { margin: 0; width: auto; max-width: 58mm; }
            .receipt { padding: 0; width: 100%; }
            .preview-actions { display: none; }
        }
    </style>
</head>
<body>
    {% for record in records %}{% for _ in range(copies) %}
    {% include "_bill_receipt.html" %}
    {% endfor %}{% endfor %}
    <div class="preview-actions">
        <button type="button" class="toolbar-btn primary" id="printReceiptBtn">Print</button>
        <button type="button" class="toolbar-btn" id="cancelPreviewBtn">Cancel</button>
    </div>
    <script>
        // Every copy is already on the page (each bill's copies together), so it prints as one job.
        // The window closes only after printing: closing right after print() can cancel the job.
        const params = new URLSearchParams(window.location.search);
        const copies = {{ copies }};
        let printing = false;

        function printReceipts() {
            if (printing) return;
            printing = true;
            window.print();
        }

        window.addEventListener("afterprint", () => {
            if (!printing) return;
            if (window.opener && params.get("from") === "entry") {
                window.opener.postMessage({ type: "receipt_print_completed", copies }, window.location.origin);
            }
            window.close();
        });
        document.getElementById("printReceiptBtn").addEventListener("click", printReceipts);
        document.getElementById("cancelPreviewBtn").addEventListener("click", () => window.close());
        if (params.get("autoprint") === "1") {
            window.addEventListener("load", () => setTimeout(printReceipts, 150));
        }
    </script>
</body>
</html>
